<!-- templates/index.html -->
<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Resume Analyzer</title>
  </head>
  <body>
    <h1>Resume Analyzer</h1>
    <form method="post" enctype="multipart/form-data">
      <label>Resume (PDF): <input type="file" name="resume" accept="application/pdf"/></label><br/><br/>
      <label>Paste Job Description (optional):</label><br/>
      <textarea name="job_description" rows="6" cols="80"></textarea><br/><br/>
      <label>Or select saved JD:
        <select name="jd_id">
          <option value="">-- none --</option>
          {% for jd in jds %}
            <option value="{{ jd[0] }}">{{ jd[1] }}</option>
          {% endfor %}
        </select>
      </label><br/><br/>
      <button type="submit">Analyze</button>
    </form>

    <hr/>
    {% if result %}
      <h2>Result</h2>
      {% if result.cached %}
        <pre>Cached Score: {{ result.score }}/100
Hash: {{ result.resume_hash }}</pre>
      {% else %}
        <pre>{{ result.raw_text }}
Score: {{ result.score }}/100
Hash: {{ result.resume_hash }}</pre>
      {% endif %}
    {% endif %}
  </body>
</html>
